name: CI
on:
  push:
    branches:
      - master
      - renovate/**
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  NET_VERSION: 10.0.x

jobs:
  check_format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.NET_VERSION }}

      - name: Check .NET format
        run: dotnet format -v diag --verify-no-changes

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.NET_VERSION }}

      - name: Test build
        run: dotnet build -c Release

      - name: Run tests
        working-directory: test/CryptoBase.Tests
        run: |
          dotnet test
          dotnet test -c Release

      - name: Run tests (Disable AVX512)
        if: matrix.os != 'macos-latest'
        working-directory: test/CryptoBase.Tests
        run: |
          dotnet test
          dotnet test -c Release
        env:
          DOTNET_EnableAVX512: 0

      - name: Run tests (Disable AVX)
        if: matrix.os != 'macos-latest'
        working-directory: test/CryptoBase.Tests
        run: |
          dotnet test
          dotnet test -c Release
        env:
          DOTNET_EnableAVX: 0

      - name: Run tests (Disable HWIntrinsic)
        working-directory: test/CryptoBase.Tests
        run: |
          dotnet test
          dotnet test -c Release
        env:
          DOTNET_EnableHWIntrinsic: 0
