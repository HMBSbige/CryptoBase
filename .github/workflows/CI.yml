name: CI
on:
  push:
    branches:
      - master
      - renovate/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  NET_VERSION: 10.0.x
  TUNIT_DISABLE_LOGO: 1

jobs:
  check_format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.NET_VERSION }}

      # Test jobs build only the test project, so the whole solution, benchmarks included, is built here.
      - name: Build
        run: dotnet build -c Release

      - name: Check .NET format
        run: dotnet format --no-restore -v diag --verify-no-changes

  test:
    name: test (${{ matrix.os }}${{ matrix.disable && format(', no {0}', matrix.disable) }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64 covers every x86 instruction-set level, under Intel SDE where the runner lacks one (see test.sh).
          - { os: ubuntu-latest }
          - { os: ubuntu-latest, disable: AVX512v2 }
          - { os: ubuntu-latest, disable: Vector512 }
          - { os: ubuntu-latest, disable: VAES }
          - { os: ubuntu-latest, disable: GFNI }
          - { os: ubuntu-latest, disable: AVX512 }
          - { os: ubuntu-latest, disable: 'AVX512,GFNI,VAES' }
          - { os: ubuntu-latest, disable: AVX2 }
          - { os: ubuntu-latest, disable: AVX }
          - { os: ubuntu-latest, disable: SSE42 }
          - { os: ubuntu-latest, disable: AES }
          - { os: ubuntu-latest, disable: HWIntrinsic }
          # Linux ARM64 covers the ARM64 switches.
          - { os: ubuntu-26.04-arm }
          - { os: ubuntu-26.04-arm, disable: Arm64Aes }
          - { os: ubuntu-26.04-arm, disable: Arm64Crc32 }
          - { os: ubuntu-26.04-arm, disable: Arm64Sha1 }
          - { os: ubuntu-26.04-arm, disable: Arm64Sha256 }
          - { os: ubuntu-26.04-arm, disable: HWIntrinsic }
          # Other platforms: default dispatch and the portable path.
          - { os: windows-latest }
          - { os: windows-latest, disable: HWIntrinsic }
          - { os: macos-latest }

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.NET_VERSION }}
      - uses: petarpetrovt/setup-sde@v6.0
        if: runner.os == 'Linux' && runner.arch == 'X64'

      - name: Build
        run: dotnet build test/CryptoBase.Tests -c Release

      - name: Test (Release)
        run: bash .github/test.sh
        env:
          DISABLE: ${{ matrix.disable }}

      - name: Test (Release, tiered compilation)
        if: ${{ !matrix.disable }}
        run: dotnet artifacts/bin/CryptoBase.Tests/release/CryptoBase.Tests.dll --minimum-expected-tests 1

      - name: Test (Debug)
        if: ${{ !matrix.disable }}
        run: dotnet test --project test/CryptoBase.Tests -c Debug --minimum-expected-tests 1
