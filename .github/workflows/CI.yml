name: CI
on:
  push:
    branches:
      - master
      - renovate/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  NET_VERSION: 10.0.x
  TUNIT_DISABLE_LOGO: 1

defaults:
  run:
    shell: bash

jobs:
  check_format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.NET_VERSION }}

      # Test jobs build only the test project, without analyzers, so the whole solution, benchmarks included, is built and analyzed here.
      - name: Build
        run: dotnet build -c Release

      - name: Check .NET format
        run: dotnet format --no-restore -v diag --verify-no-changes

      - name: Check test shards
        run: bash .github/test.sh shards

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64 covers the x86 instruction-set levels below the ones that the avx512 jobs cover.
          - { os: ubuntu-latest, disable: 'AVX512,GFNI,VAES AVX2 AVX SSE42 AES HWIntrinsic' }
          # Linux ARM64 covers the ARM64 switches.
          - { os: ubuntu-26.04-arm, disable: 'none Arm64Aes Arm64Crc32 Arm64Sha1 Arm64Sha256 HWIntrinsic' }
          # Other platforms: default dispatch and the portable path.
          - { os: windows-latest, disable: 'none HWIntrinsic' }
          - { os: macos-latest }

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.NET_VERSION }}

      - name: Build
        run: dotnet build test/CryptoBase.Tests -c Release -p:RunAnalyzers=false

      - name: Test (Release)
        run: bash .github/test.sh
        env:
          DISABLE: ${{ matrix.disable }}

      - name: Test (Release, tiered compilation)
        run: bash .github/test.sh tiered

  debug:
    name: debug (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm, windows-latest, macos-latest]
        # Two halves that take about as long.
        shard: [ec, 'hashes,ciphers,rest']

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.NET_VERSION }}

      - name: Test (Debug)
        run: bash .github/test.sh debug
        env:
          SHARD: ${{ matrix.shard }}

  # Linux x64 runners differ in CPU, and only some have every instruction set that the AVX-512 paths take. These jobs each try for one, and run the tests natively if they get one; avx512_sde runs them under Intel SDE, sharded since emulation is slow, if none does.
  avx512:
    name: avx512 (try ${{ matrix.try }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        try: [1, 2, 3, 4, 5]
    # Matrix jobs combine their outputs, leaving out empty ones, so native is set if any job got one.
    outputs:
      native: ${{ steps.probe.outputs.native }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.NET_VERSION }}
      - uses: petarpetrovt/setup-sde@v6.0

      - name: Probe
        id: probe
        run: |
          missing=$(bash .github/test.sh probe)
          [[ -n $missing ]] || echo native=true >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.probe.outputs.native
        run: dotnet build test/CryptoBase.Tests -c Release -p:RunAnalyzers=false

      # The runs match the avx512_sde matrix; Vector512 still takes the AVX-512VL paths.
      - name: Test (Release)
        if: steps.probe.outputs.native
        run: bash .github/test.sh
        env:
          DISABLE: none AVX512v2 Vector512 VAES GFNI AVX512

  avx512_sde:
    name: avx512 sde (${{ matrix.disable && format('no {0}, ', matrix.disable) }}${{ matrix.shard }})
    needs: avx512
    if: ${{ !cancelled() && !needs.avx512.outputs.native }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        disable: ['', AVX512v2, Vector512, VAES, GFNI, AVX512]
        shard: [hashes, ciphers, ec, rest]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.NET_VERSION }}
      - uses: petarpetrovt/setup-sde@v6.0

      - name: Build
        run: dotnet build test/CryptoBase.Tests -c Release -p:RunAnalyzers=false

      - name: Test (Release)
        run: bash .github/test.sh
        env:
          DISABLE: ${{ matrix.disable }}
          SHARD: ${{ matrix.shard }}
