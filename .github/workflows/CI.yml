name: CI
on:
  push:
    branches:
      - master
      - renovate/**
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  NET_VERSION: 10.0.x

jobs:
  check_format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.NET_VERSION }}

      - name: Check .NET format
        run: dotnet format -v diag --verify-no-changes

  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: test/CryptoBase.Tests
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
        include:
          - os: ubuntu-latest
          - os: ubuntu-latest
            disable: AVX512v2
          - os: ubuntu-latest
            disable: AVX512
          - os: ubuntu-latest
            disable: VAES
          - os: ubuntu-latest
            disable: GFNI
          - os: ubuntu-latest
            disable: AVX2
          - os: ubuntu-latest
            disable: AVX
          - os: ubuntu-latest
            disable: SSE42
          - os: ubuntu-latest
            disable: AES
          - os: ubuntu-latest
            disable: HWIntrinsic

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.NET_VERSION }}
      - uses: petarpetrovt/setup-sde@v6.0
        if: runner.os == 'Linux' && matrix.disable != 'HWIntrinsic'

      - name: Build (Release)
        working-directory: .
        run: dotnet build -c Release

      - name: Build instruction set probe
        if: runner.os == 'Linux' && matrix.disable != 'HWIntrinsic'
        run: dotnet build ../../.github/InstructionSets.cs -c Release -o ../../artifacts/bin/InstructionSets

      - name: Run tests (Release)
        if: ${{ !matrix.disable }}
        run: &run-tests |
          export DOTNET_TieredCompilation=0
          test_runner=(dotnet)
          if [[ -n "${SDE_PATH:-}" && "${DOTNET_EnableHWIntrinsic:-1}" != 0 ]]; then
            probe=../../artifacts/bin/InstructionSets/InstructionSets.dll
            native=$(dotnet "$probe")
            emulated=$(DOTNET_EnableDiagnostics=0 "$SDE_PATH/sde64" -spr -- dotnet "$probe")
            missing=$(LC_ALL=C comm -13 <(printf '%s\n' "$native") <(printf '%s\n' "$emulated") | paste -sd,)
            if [[ -n "$missing" ]]; then
              test_runner=("$SDE_PATH/sde64" -spr -- dotnet)
              export DOTNET_EnableDiagnostics=0
              echo "Runner: SDE; missing: ${missing//,/, }"
            else
              echo "Runner: native"
            fi
          else
            echo "Runner: native"
          fi
          "${test_runner[@]}" ../../artifacts/bin/CryptoBase.Tests/release/CryptoBase.Tests.dll --disable-logo --minimum-expected-tests 1

      - name: Run tests (Release, tiered compilation)
        if: ${{ !matrix.disable }}
        run: dotnet ../../artifacts/bin/CryptoBase.Tests/release/CryptoBase.Tests.dll --disable-logo --minimum-expected-tests 1

      - name: Run tests (Debug)
        if: ${{ !matrix.disable }}
        run: dotnet test -c Debug --no-restore --disable-logo --minimum-expected-tests 1

      - name: Run tests (Disable AVX512v2)
        if: matrix.os == 'windows-latest' || matrix.disable == 'AVX512v2'
        run: *run-tests
        env:
          DOTNET_EnableAVX512v2: 0

      - name: Run tests (Disable AVX512)
        if: matrix.os == 'windows-latest' || matrix.disable == 'AVX512'
        run: *run-tests
        env:
          DOTNET_EnableAVX512: 0

      - name: Run tests (Disable VAES)
        if: matrix.os == 'windows-latest' || matrix.disable == 'VAES'
        run: *run-tests
        env:
          DOTNET_EnableVAES: 0

      - name: Run tests (Disable GFNI)
        if: matrix.os == 'windows-latest' || matrix.disable == 'GFNI'
        run: *run-tests
        env:
          DOTNET_EnableGFNI: 0

      - name: Run tests (Disable AVX2)
        if: matrix.os == 'windows-latest' || matrix.disable == 'AVX2'
        run: *run-tests
        env:
          DOTNET_EnableAVX2: 0

      - name: Run tests (Disable AVX)
        if: matrix.os == 'windows-latest' || matrix.disable == 'AVX'
        run: *run-tests
        env:
          DOTNET_EnableAVX: 0

      - name: Run tests (Disable x86-64-v2 intrinsics)
        if: matrix.os == 'windows-latest' || matrix.disable == 'SSE42'
        run: *run-tests
        env:
          DOTNET_EnableSSE42: 0

      - name: Run tests (Disable AES)
        if: matrix.os == 'windows-latest' || matrix.disable == 'AES'
        run: *run-tests
        env:
          DOTNET_EnableAES: 0

      - name: Run tests (Disable ARM64 AES)
        if: matrix.os == 'macos-latest'
        run: *run-tests
        env:
          DOTNET_EnableArm64Aes: 0

      - name: Run tests (Disable ARM64 CRC32)
        if: matrix.os == 'macos-latest'
        run: *run-tests
        env:
          DOTNET_EnableArm64Crc32: 0

      - name: Run tests (Disable ARM64 SHA1)
        if: matrix.os == 'macos-latest'
        run: *run-tests
        env:
          DOTNET_EnableArm64Sha1: 0

      - name: Run tests (Disable ARM64 SHA256)
        if: matrix.os == 'macos-latest'
        run: *run-tests
        env:
          DOTNET_EnableArm64Sha256: 0

      - name: Run tests (Disable HWIntrinsic)
        if: runner.os != 'Linux' || matrix.disable == 'HWIntrinsic'
        run: *run-tests
        env:
          DOTNET_EnableHWIntrinsic: 0
